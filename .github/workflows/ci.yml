name: QA Toolkit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python tests & linting ──────────────────────────────────────
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest tests/ -v --tb=short

      - name: Typecheck core modules
        run: |
          pip install mypy
          python -m mypy core/ config/ --ignore-missing-imports || true

  # ── Playwright tests ────────────────────────────────────────────
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Playwright smoke tests
        run: npx playwright test specs/smoke.spec.ts --project=chromium
        env:
          QA_BASE_URL: https://httpbin.org
        continue-on-error: true  # Don't block CI on external site flakiness

      - name: Authenticated-QA tools load & run (no secrets)
        run: |
          node --check core/session.js
          node --check app-auditor.js
          node --check form-fuzzer.js
          node --check security-vitals.js
          # exercise security-vitals against a public site (no login needed)
          node security-vitals.js --url https://example.com --output sv-ci.json
          node -e "const r=require('./sv-ci.json');if(!r.hosts||!Object.keys(r.hosts).length)process.exit(1);console.log('security-vitals OK')"
        continue-on-error: true  # external-site flakiness shouldn't block CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Data tool validation ────────────────────────────────────────
  data-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate data tools are importable
        run: |
          python -c "from core.base_api_client import BaseApiClient; print('✅ BaseApiClient OK')"
          python -c "from core.builders import Builder, TypedBuilder; print('✅ Builders OK')"
          python -c "from config.env import env; print('✅ Config OK')"

      - name: Check CLI tools have help text
        run: |
          python data-validator.py --help || true
          python excel-ops.py --help || true
          python address-parser.py --help || true
